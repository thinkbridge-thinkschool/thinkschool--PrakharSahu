<div class="shell">
  <header class="masthead">
    <a class="brand" routerLink="/quotes">
      <span class="brand-mark" aria-hidden="true">“</span>
      <h1>Quotes</h1>
    </a>

    <nav aria-label="Main">
      <a routerLink="/quotes" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        All quotes
      </a>
      <a routerLink="/quotes/new" routerLinkActive="active" data-testid="nav-new">New quote</a>
      @if (tokens.isSignedIn()) {
        <button type="button" data-testid="sign-out" (click)="tokens.clear()">
          <span class="session-dot" aria-hidden="true"></span> Sign out
        </button>
      } @else {
        <a routerLink="/sign-in" routerLinkActive="active" data-testid="nav-sign-in">Sign in</a>
      }
    </nav>
  </header>

  <router-outlet />
</div>
